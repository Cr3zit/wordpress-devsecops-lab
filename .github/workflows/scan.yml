name: WordPress WPScan Security Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  wordpress-wpscan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start MySQL container
        run: |
          docker run -d --name wp-db \
            -e MYSQL_ROOT_PASSWORD=rootpassword \
            -e MYSQL_DATABASE=wordpress \
            -e MYSQL_USER=wpuser \
            -e MYSQL_PASSWORD=wppass \
            --network host \
            mysql:8.0

      - name: Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL..."
          for i in {1..30}; do
            if docker exec wp-db mysqladmin ping -h localhost -u root -prootpassword --silent 2>/dev/null; then
              echo "MySQL is ready!"
              break
            fi
            sleep 3
          done

      - name: Start WordPress container
        run: |
          docker run -d --name wp-site \
            -e WORDPRESS_DB_HOST=127.0.0.1:3306 \
            -e WORDPRESS_DB_USER=wpuser \
            -e WORDPRESS_DB_PASSWORD=wppass \
            -e WORDPRESS_DB_NAME=wordpress \
            --network host \
            wordpress:latest

      - name: Wait for WordPress to be ready
        run: |
          echo "Waiting for WordPress..."
          for i in {1..40}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:80 || echo "000")
            if [[ "$STATUS" == "200" || "$STATUS" == "301" || "$STATUS" == "302" ]]; then
              echo "WordPress is ready! (HTTP $STATUS)"
              break
            fi
            echo "Attempt $i: HTTP $STATUS, waiting..."
            sleep 5
          done

      - name: Install WP-CLI and complete WordPress installation
        run: |
          docker exec wp-site bash -c "
            curl -sO https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
            chmod +x wp-cli.phar
            php wp-cli.phar core install \
              --url='http://localhost' \
              --title='Test WordPress Site' \
              --admin_user='admin' \
              --admin_password='admin123!' \
              --admin_email='admin@test.com' \
              --allow-root
          "

      - name: Install WPScan
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ruby-full build-essential libcurl4-openssl-dev zlib1g-dev
          sudo gem install wpscan --no-document

      - name: Run BEFORE scan
        run: |
          mkdir -p scans
          wpscan --update || true
          wpscan \
            --url http://localhost:80 \
            --enumerate u,vp,vt,tt,cb,dbe \
            --force \
            --format json \
            --output scans/wpscan-before.json \
          || true
          echo "BEFORE scan done."

      - name: Apply hardening via WP-CLI
        run: |
          docker exec wp-site bash -c "
            # Remove sensitive files
            rm -f /var/www/html/readme.html
            rm -f /var/www/html/license.txt
            rm -f /var/www/html/wp-config-sample.php

            # Disable XML-RPC
            mkdir -p /var/www/html/wp-content/mu-plugins
            cat > /var/www/html/wp-content/mu-plugins/hardening.php << 'EOF'
          <?php
          add_filter('xmlrpc_enabled', '__return_false');
          remove_action('wp_head', 'wp_generator');
          add_filter('the_generator', '__return_empty_string');
          if (!defined('DISABLE_WP_CRON')) { define('DISABLE_WP_CRON', true); }
          if (!is_admin()) {
            if (isset(\$_GET['author']) && is_numeric(\$_GET['author'])) {
              wp_redirect(home_url(), 301); exit;
            }
          }
          EOF

            echo 'Hardening applied!'
          "

      - name: Run AFTER scan
        run: |
          wpscan \
            --url http://localhost:80 \
            --enumerate u,vp,vt,tt,cb,dbe \
            --force \
            --format json \
            --output scans/wpscan-after.json \
          || true
          echo "AFTER scan done."

      - name: Display comparison summary
        run: |
          echo "=== BEFORE hardening ==="
          python3 -c "
          import json
          with open('scans/wpscan-before.json') as f:
            data = json.load(f)
          findings = data.get('interesting_findings', [])
          print(f'Interesting findings: {len(findings)}')
          for x in findings:
            print(f'  - {x.get(\"type\",\"?\")}')
          "
          echo "=== AFTER hardening ==="
          python3 -c "
          import json
          with open('scans/wpscan-after.json') as f:
            data = json.load(f)
          findings = data.get('interesting_findings', [])
          print(f'Interesting findings: {len(findings)}')
          for x in findings:
            print(f'  - {x.get(\"type\",\"?\")}')
          "

      - name: Upload scan artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wpscan-results-${{ github.run_number }}
          path: scans/
          retention-days: 30

      - name: Cleanup containers
        if: always()
        run: |
          docker stop wp-site wp-db || true
          docker rm wp-site wp-db || true
          docker volume prune -f || true